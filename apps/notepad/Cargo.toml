[package]
name = "nixe-notepad"
version = "0.1.0"
description = "A plain-text notepad for Omarchy with tabs, adjustable fonts and sessions that keep unsaved text"
license = "MIT"
repository = "https://github.com/design-nexus/nixe-notepad"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nixe-notepad"
path = "src/main.rs"

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "e4595e68a4fd9b44bd15e95311ace1d0fb669bc4" }
serde_json = "1"
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "0319940fb27bb5fc7f04742bcb2bd331b384c425" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "0319940fb27bb5fc7f04742bcb2bd331b384c425" }
anyhow = "1.0.104"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
